name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair o projeto
        run: unzip -q -o android-projeto-1.zip -d projeto
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar o APK
        working-directory: projeto
        run: gradle assembleDebug --no-daemon
      - name: Copiar o APK
        run: cp projeto/app/build/outputs/apk/debug/app-debug.apk Calculadora.apk
      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Calculadora APK ${{ github.run_number }}
          files: Calculadora.apk
